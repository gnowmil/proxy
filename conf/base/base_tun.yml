# Optimized for: PVE Debian 13 VM as transparent gateway, mihomo v1.19.x
# DNS chain (confirmed 2026-11-05): LAN clients -> AdGuardHome:53 -> mihomo:5353 -> DoH
# Do NOT point mihomo nameserver back to AdGuardHome, otherwise
# AdGuardHome -> mihomo -> AdGuardHome would loop.
# Formal deployment: fill secret below with a long random password.
# GitHub backup keeps secret: '' on purpose, never commit a real secret.
mixed-port: 7897
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
external-controller: 0.0.0.0:9090
external-ui: /etc/mihomo/ui
secret: ''

profile:
  store-selected: true
  store-fake-ip: true

unified-delay: true
tcp-concurrent: true

upnp:
  enable: true
  listen-port: 7895
  gateway: 10.0.0.1
  # Note: this is mihomo's own UPnP. Console UPnP (Xbox / PS5 / Switch)
  # also requires UPnP enabled on MikroTik 10.0.0.1, otherwise consoles
  # stay on Strict NAT even if this block is on.

tun:
  enable: true
  stack: system
  device: mihomo
  dns-mode: hijack
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: 1480  # PPPoE MTU 1480, avoid UDP fragmentation
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  strict-route: true
  route-exclude-address:
    - 10.0.0.0/8
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 100.64.0.0/10
    - 10.0.0.1/32
  # Do NOT exclude 198.18.0.0/15: fake-ip packets must enter TUN.
  udp-timeout: 300
  # Keep true for Xbox / PS5 / Switch: endpoint-independent (full-cone) UDP
  # mapping is what lets consoles get Open / Type 2 NAT for P2P, party chat
  # and matchmaking. Cost is a slightly larger UDP NAT table, negligible on
  # a PVE VM compared with the game benefit. If consoles are removed later,
  # set this to false for a small throughput gain.
  endpoint-independent-nat: true

hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  doh.pub: [1.12.12.12, 1.12.12.21, 120.53.53.53]
  dns.google: [8.8.8.8, 8.8.4.4]
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1]
  # IPv6 hosts removed: dns.ipv6 is false below, so they would never be used.

dns:
  enable: true
  cache-algorithm: arc
  cache-max-size: 4096
  min-ttl: 60
  max-ttl: 3600
  listen: 0.0.0.0:5353
  ipv6: false
  prefer-h3: false
  respect-rules: true
  enhanced-mode: fake-ip
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.76.76.76
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn,apple-cn,google-cn,microsoft-cn,games-cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    # Apple (2026-11-07): geosite:apple was removed from geosite-all.dat,
    # only apple-cn remains, so Apple domains are listed explicitly here
    # (same set as fake-ip-filter below) to resolve via AliDNS / China CDN.
    "+.apple.com,+.icloud.com,+.cdn-apple.com,+.mzstatic.com,+.aaplimg.com,+.icloud-content.com,+.apple-cloudkit.com":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:gfw,proxy":
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # NOTE: the old '*' entry was removed (2026-11-07) - it matched nothing
    # (fake-IPs were still returned for Apple/Google), so it was dead config.
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - '+.cloudflare.com'
    - '+.argotunnel.com'
    - '+.cloudflareaccess.com'
    - '+.cftunnel.com'
    - 'geosite:fakeip-filter,cn'
    # Apple (2026-11-07): bypass fake-IP so CHR-gateway devices get real
    # IPs and connect direct to Apple China CDN, instead of a fake-IP that
    # only works via mihomo. Android clouds are already in ChinaList.txt
    # (AGH -> AliDNS), so they never reach mihomo and need no entry here.
    - '+.apple.com'
    - '+.icloud.com'
    - '+.cdn-apple.com'
    - '+.mzstatic.com'
    - '+.aaplimg.com'
    - '+.icloud-content.com'
    - '+.apple-cloudkit.com'
  # fallback / fallback-filter removed: deprecated in favour of
  # nameserver-policy above. AdGuardHome is upstream of mihomo in the
  # LAN chain, NOT a mihomo nameserver.

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  # force-domain removed 2026-11-05, replaced by force-dns-mapping above:
  # a bare '+' in force-domain is rejected by current mihomo (v1.19):
  # "invalid domain \"+\": \"+\" wildcard must be followed by another label".
  # force-dns-mapping only forces sniffing for DNS-mapped (fake-ip/redir-host)
  # traffic, to verify the real domain, instead of sniffing every connection;
  # parse-pure-ip (above) still covers pure-IP traffic with no known domain.
  # If a specific domain is later misrouted, add it as '+.example.com' to
  # force-domain, not a bare '+'.
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
      override-destination: true
  skip-domain:
    - '+.io.mi.com'
    - '+.mi.com'
    - '+.xiaomi.com'
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - '+.push.apple.com'
    - '+.cloudflare.com'
    - '+.argotunnel.com'

geodata-mode: true
geox-url:
  geoip: "https://gh-proxy.com/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-geodata/geoip-all.dat"
  geosite: "https://gh-proxy.com/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-geodata/geosite-all.dat"
  # mmdb / asn removed: no ASN rules are used in this config, so their
  # daily downloads were waste. Re-add them if you add ASN rules later.
geo-auto-update: true
geo-update-interval: 24

proxies:
