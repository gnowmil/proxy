[custom]
clash_rule_base = base/base_tun.yml
enable_rule_generator=true

# DNS chain: LAN -> AdGuardHome:53 -> mihomo:5353 (this base file).
# AdGuardHome already does ad-blocking for the whole house, so the REJECT
# ads ruleset below stays disabled here to avoid double filtering.
# MATCH,DIRECT is intentional for a gateway with consoles: unknown traffic
# goes DIRECT, not via a proxy node. Overseas sites are already covered by
# GEOSITE gfw/proxy above it, so DIRECT fallback protects games, banking
# and other services that break via proxy, and keeps game latency low.
# Game traffic: games-cn is DIRECT, overseas games go to Gamebooster.
# Gamebooster is now url-test (was select with a test URL), so games pick
# the lowest-latency node instead of sticking to the first one.
# 2026-11-07 geosite cleanup: DustinWin removed several geosite categories
# from geosite-all.dat (e.g. geosite:apple, only apple-cn remains). All
# GEOSITE refs below were checked against the remaining list
# (fakeip-filter, ads, private, trackerslist, microsoft-cn, apple-cn,
# google-cn, games-cn, games, netflix, disney, max, primevideo, appletv,
# youtube, tiktok, bilibili, spotify, media, ai, networktest, tld-proxy,
# gfw, proxy, cn) - none reference a removed category. Apple full domains
# are handled by explicit entries in base_tun.yml (fake-ip-filter +
# nameserver-policy), not by geosite:apple. Added 🇮🇳 IN group (Base 印度
# node) for parity with Loon; 🇺🇳 now excludes 印度 so the node is not in
# both IN and 🇺🇳. CA group kept even though no CA node is in the current
# subscription list (empty group is harmless; remove if it stays empty).
# 2026-11-19: added 🇹🇷 TR group (Base 土耳其 node was buried in 🇺🇳);
# fixed 🇮🇳 IN regex which matched 印度尼西亚 (Indonesia) via the 印度
# substring — IN now excludes 印度尼西亚/印尼/Indonesia/🇮🇩, and 🇺🇳
# no longer excludes 印度尼西亚 (印度 changed to 印度(?!尼西亚)) so the
# Indonesia node falls into 🇺🇳 instead of IN.
# 2026-11-20: added 🏠 家宽 group (13 home-broadband nodes: 5 Plus + 8 Base);
# all region groups + 🇺🇳 + 🛟 Fallback now exclude 家宽 so those nodes live
# only in 🏠 家宽; 🏠 家宽 added to 🤖️ AI / 🎮 Gamebooster / 🍟 ProxyMedia /
# 🚀 Select. NOTE: 🇰🇷 KR / 🇦🇺 AU / 🇬🇧 UK become empty — their only nodes
# are 家宽 nodes (now in 🏠 家宽); keep the groups, remove if they stay empty.
# 🎮 Gamebooster changed url-test -> select (url-test cannot list a subgroup
# as a selectable option); its members are 🏠 家宽 + the game regions HK/TW/JP/US.

#ruleset=REJECT,[]GEOSITE,ads
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Download.list
ruleset=DIRECT,rules/my_rules/self.list
ruleset=DIRECT,https://raw.githubusercontent.com/gnowmil/proxy/refs/heads/main/rules/direct.list
ruleset=🍟 ProxyMedia,https://raw.githubusercontent.com/gnowmil/proxy/refs/heads/main/rules/media.list
ruleset=🚀 Select,rules/my_rules/proxy.list
ruleset=🚀 Select,https://raw.githubusercontent.com/gnowmil/proxy/refs/heads/main/rules/proxy.list
ruleset=🎮 Gamebooster,https://raw.githubusercontent.com/gnowmil/proxy/refs/heads/main/rules/game.list
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOSITE,networktest
ruleset=DIRECT,[]GEOSITE,games-cn
ruleset=DIRECT,[]GEOSITE,apple-cn
# 2026-11-28: disabled (user instruction) - google-cn now falls through to GEOSITE,ai, so aicode.googleapis.com goes via proxy and Gemini works from the CT.
#ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,microsoft-cn
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,private,no-resolve
ruleset=DIRECT,[]GEOIP,cn,no-resolve
# 2026-11-28: agy Gemini API host is not in GEOSITE,ai, so route it to the AI group explicitly (google-cn rule already disabled above).
ruleset=🤖️ AI,[]DOMAIN-SUFFIX,aicode.googleapis.com
ruleset=🤖️ AI,[]GEOSITE,ai
ruleset=🍟 ProxyMedia,[]GEOSITE,media
ruleset=🎮 Gamebooster,[]GEOSITE,games
ruleset=🚀 Select,[]GEOSITE,trackerslist
ruleset=🚀 Select,[]GEOSITE,tld-proxy
ruleset=🚀 Select,[]GEOSITE,gfw
ruleset=🚀 Select,[]GEOSITE,proxy
#ruleset=🍟 ProxyMedia,[]GEOIP,media,no-resolve
#ruleset=🎮 Gamebooster,[]GEOIP,games,no-resolve
ruleset=🚀 Select,[]GEOIP,telegram
ruleset=DIRECT,[]MATCH

custom_proxy_group=🤖️ AI`select`[]🇺🇸 US`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🇰🇷 KR`[]🇬🇧 UK`[]🇩🇪 DE`[]🇨🇦 CA`[]🇦🇺 AU`[]🇮🇳 IN`[]🇹🇷 TR`[]🏠 家宽`[]🚀 Select
custom_proxy_group=🍟 ProxyMedia`select`[]🚀 Select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇸🇬 SG`[]🇰🇷 KR`[]🇯🇵 JP`[]🇬🇧 UK`[]🇩🇪 DE`[]🇦🇺 AU`[]🇨🇦 CA`[]🇺🇸 US`[]🇮🇳 IN`[]🇹🇷 TR`[]🏠 家宽
custom_proxy_group=🎮 Gamebooster`select`[]🏠 家宽`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇺🇸 US
custom_proxy_group=🚀 Select`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇸🇬 SG`[]🇰🇷 KR`[]🇯🇵 JP`[]🇬🇧 UK`[]🇩🇪 DE`[]🇦🇺 AU`[]🇨🇦 CA`[]🇺🇸 US`[]🇮🇳 IN`[]🇹🇷 TR`[]🏠 家宽`[]🇺🇳`[]🛟 Fallback
custom_proxy_group=🛟 Fallback`fallback`^(?=.*(.))(?!.*((?i)回国|校园|IPLC|游戏|🎮|家宽|重置|流量|有效期)).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇺🇳`select`^(?!.*(香港|🇭🇰|HK|Taiwan|台灣|台湾|🇹🇼|日本|🇯🇵|JP|韓國|韩国|KR|🇰🇷|新加坡|🇸🇬|SG|德國|德国|🇩🇪|DE|英國|英国|🇬🇧|UK|加拿大|🇨🇦|CA|澳洲|🇦🇺|AU|印度(?!尼西亚)|🇮🇳|土耳其|🇹🇷|Turkey|美國|美国|🇺🇸|US|回国|校园|群|邀请|官网|流量|到期|版本|已用|家宽)).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇭🇰 HK`url-test`^(?=.*((?i)🇭🇰|香港|(\b(HK|HKG|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇹🇼 TW`url-test`^(?=.*((?i)🇹🇼|台湾|台灣|(\b(TW|TWN|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇯🇵 JP`url-test`^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|JPN|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇰🇷 KR`url-test`^(?=.*((?i)🇰🇷|韩国|韓國|韓|首尔|(\b(KR|KOR|Korea)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇸🇬 SG`url-test`^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|SGP|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇩🇪 DE`url-test`^(?=.*((?i)🇩🇪|德国|德國|柏林|慕尼黑|汉堡|科隆|(\b(Germany|DEU|DE)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇦🇺 AU`url-test`^(?=.*((?i)🇦🇺|澳洲|澳大利亚|(\b(AU|Australia)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇮🇳 IN`url-test`^(?=.*((?i)🇮🇳|印度|(\b(IN|IND|India)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|印度尼西亚|印尼|Indonesia|🇮🇩|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇬🇧 UK`url-test`^(?=.*((?i)🇬🇧|英国|英國|(\b(UK|United Kingdom|England)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇨🇦 CA`url-test`^(?=.*((?i)🇨🇦|加拿大|渥太华|(\b(CA|Canada)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇺🇸 US`url-test`^(?=.*((?i)🇺🇸|美国|美國|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States)(\d+)?\b)))(?!.*((?i)回国|校园|家宽)).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇹🇷 TR`url-test`^(?=.*((?i)🇹🇷|土耳其|(\b(TR|TUR|Turkey)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|家宽|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🏠 家宽`url-test`^(?=.*((?i)家宽))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$`http://www.gstatic.com/generate_204`300
